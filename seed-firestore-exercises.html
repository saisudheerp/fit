      window.seedExercises = async function () {
        const btn = document.getElementById("seedBtn");
        const statusDiv = document.getElementById("status");

        btn.disabled = true;
        statusDiv.innerHTML = "<p>Starting seed process...</p>";

        try {
          // Check if exercises already exist
          const existingExercises = await getDocs(collection(db, "exercises"));
          if (!existingExercises.empty) {
            const confirmOverwrite = confirm(
              `Found ${existingExercises.size} existing exercises. Do you want to add these exercises anyway? (This will create duplicates)`
            );
            if (!confirmOverwrite) {
              statusDiv.innerHTML = '<p class="error">❌ Seeding cancelled</p>';
              btn.disabled = false;
              return;
            }
          }

          let successCount = 0;
          let errorCount = 0;

          for (let i = 0; i < exercises.length; i++) {
            const exercise = exercises[i];
            try {
              await addDoc(collection(db, "exercises"), exercise);
              successCount++;
              statusDiv.innerHTML = `
                            <p class="progress">Progress: ${i + 1}/${
                exercises.length
              }</p>
                            <p class="success">✓ Added: ${exercise.name}</p>
                            <p>Success: ${successCount} | Errors: ${errorCount}</p>
                        `;
            } catch (error) {
              errorCount++;
              console.error(`Error adding ${exercise.name}:`, error);
              statusDiv.innerHTML += `<p class="error">✗ Failed: ${exercise.name} - ${error.message}</p>`;
            }
          }

          statusDiv.innerHTML += `
                    <hr>
                    <h2 class="success">✅ Seeding Complete!</h2>
                    <p><strong>Successfully added:</strong> ${successCount} exercises</p>
                    <p><strong>Errors:</strong> ${errorCount}</p>
                `;
        } catch (error) {
          statusDiv.innerHTML += `<p class="error">❌ Fatal error: ${error.message}</p>`;
          console.error("Seeding error:", error);
        } finally {
          btn.disabled = false;
        }
      };
